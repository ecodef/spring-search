name: Publish package to the Maven Central Repository
on:
  release:
    types: [created]
  workflow_dispatch:
  
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: 'dev'
    steps:
      - uses: actions/checkout@v3
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'semeru'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: List secret keys
        run:  gpg --list-secret-keys     
      - name: Verify bundle contents (POM, jar and signatures)
        run: |
          mvn --batch-mode -DskipTests verify
          v=$(mvn --batch-mode -q -DforceStdout help:evaluate -Dexpression=project.version)
          for f in target/spring-search-$v.jar target/spring-search-$v-sources.jar target/spring-search-$v-javadoc.jar \
                   target/spring-search-$v.jar.asc target/spring-search-$v.pom.asc; do
            test -s "$f" || { echo "Missing $f"; exit 1; }
          done
          test -s pom.xml
      - name: Publish package
        run: mvn --batch-mode -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
